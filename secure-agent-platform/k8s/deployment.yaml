apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-agent-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: secure-agent-platform
  template:
    metadata:
      labels:
        app: secure-agent-platform
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      containers:
        - name: app
          image: secure-agent-platform:latest
          ports:
            - containerPort: 8000
            - containerPort: 9090
          envFrom:
            - secretRef:
                name: secure-agent-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: secure-agent-platform
spec:
  selector:
    app: secure-agent-platform
  ports:
    - name: http
      port: 80
      targetPort: 8000
    - name: metrics
      port: 9090
      targetPort: 9090
  type: ClusterIP
