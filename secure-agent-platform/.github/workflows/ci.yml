name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - "projet-2/**"
  pull_request:
    branches: [main]
    paths:
      - "projet-2/**"

defaults:
  run:
    working-directory: projet-2

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projet-2/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check app/ tests/

      - name: Type check
        run: mypy app/

      - name: Test
        run: pytest --cov=app --cov-report=xml
        env:
          APP_ENV: test
          SECRET_KEY: test-secret-key
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/secure_platform_test
          DATABASE_URL_SYNC: postgresql://postgres:postgres@localhost:5432/secure_platform_test
          OPA_URL: http://localhost:8181

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: projet-2/coverage.xml
          flags: projet-2

  build:
    needs: quality
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: projet-2
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/secure-agent-platform:latest
            ghcr.io/${{ github.repository }}/secure-agent-platform:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
