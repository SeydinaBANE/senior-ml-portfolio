apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-platform-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agent-platform-api
  template:
    metadata:
      labels:
        app: agent-platform-api
    spec:
      containers:
        - name: api
          image: agent-platform:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: agent-platform-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-platform-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-platform-ui
  template:
    metadata:
      labels:
        app: agent-platform-ui
    spec:
      containers:
        - name: ui
          image: agent-platform:latest
          command: ["streamlit", "run", "ui/streamlit_app.py", "--server.port=8501"]
          ports:
            - containerPort: 8501
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: agent-platform-api
spec:
  selector:
    app: agent-platform-api
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: agent-platform-ui
spec:
  selector:
    app: agent-platform-ui
  ports:
    - port: 8501
      targetPort: 8501
  type: ClusterIP
