services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./app:/app/app
      - ./.secrets:/app/.secrets

  ui:
    build: .
    command: ["streamlit", "run", "ui/streamlit_app.py", "--server.port=8501"]
    ports:
      - "8501:8501"
    env_file: .env
    depends_on:
      - app
    volumes:
      - ./.secrets:/app/.secrets
