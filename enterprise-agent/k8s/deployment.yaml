apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-agent
  labels:
    app: enterprise-agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: enterprise-agent
  template:
    metadata:
      labels:
        app: enterprise-agent
    spec:
      containers:
        - name: app
          image: enterprise-agent:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: enterprise-agent-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: enterprise-agent
spec:
  selector:
    app: enterprise-agent
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
